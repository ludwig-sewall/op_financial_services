name: cd

on:
  push:
    branches: [main, master]

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Naming convention
        run: python3 scripts/check_naming.py
      - name: Test coverage
        run: pip install pyyaml && python3 scripts/check_test_coverage.py
