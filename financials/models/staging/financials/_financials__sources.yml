version: 2
sources:
- name: financials
  description: >-
    Management accounting at party grain (RAW_FINANCIALS). Revenue is transactional; cost is an allocation
    and some party-months are missing.
  schema: raw_financials
  tables:
  - name: revenue_transactions
    description: One row per revenue posting. Amount is null when the posting failed to price.
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 100000
          period: hour
    columns:
    - name: transaction_id
      data_tests:
      - unique
      - not_null
  - name: allocated_costs
    description: One row per party per month. Cost is null when finance has not allocated yet.
    columns:
    - name: allocation_id
      data_tests:
      - unique
      - not_null
