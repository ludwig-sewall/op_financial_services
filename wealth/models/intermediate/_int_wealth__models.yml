version: 2
models:
- name: int_wealth_portfolios__open_by_customer
  description: Open portfolios and AUM per client.
  columns:
  - name: wealth_customer_id
    data_tests:
    - unique
    - not_null
- name: int_wealth_trades__monthly_by_portfolio
  description: Trading activity per portfolio and month.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      description: 'Grain: one row per portfolio_id, trade_month.'
      arguments:
        combination_of_columns:
        - portfolio_id
        - trade_month
  columns:
  - name: portfolio_id
    data_tests:
    - not_null
- name: int_wealth_portfolios__activity
  description: Trading activity over the year per portfolio.
  columns:
  - name: portfolio_id
    data_tests:
    - unique
    - not_null
unit_tests:
- name: test_buys_and_sells_split_by_month
  given:
  - input: ref('stg_wealth__trades')
    rows:
    - trade_id: T1
      portfolio_id: PF
      trade_date: '2026-03-02'
      trade_side: buy
      amount: 1000
      fee: 2
    - trade_id: T2
      portfolio_id: PF
      trade_date: '2026-03-20'
      trade_side: sell
      amount: 400
      fee: 1
    - trade_id: T3
      portfolio_id: PF
      trade_date: '2026-02-10'
      trade_side: buy
      amount: 50
      fee: 0.5
  expect:
    rows:
    - portfolio_id: PF
      trade_month: '2026-03-01'
      trade_count: 2
      buy_amount: 1000
      sell_amount: 400
      fees: 3
    - portfolio_id: PF
      trade_month: '2026-02-01'
      trade_count: 1
      buy_amount: 50
      sell_amount: 0
      fees: 0.5
  model: int_wealth_trades__monthly_by_portfolio
